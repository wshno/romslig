# Stands in for Traefik + Authelia forward auth in docker-compose.e2e.yml: one origin, /api to the
# API and everything else to the SPA, with the Remote-* headers set on every request. proxy_set_header
# replaces whatever the client sent, so a browser can't pick its own user (as with Authelia).
# Another user for a test: run a second proxy, or change the values here.

server {
    listen 8080;

    # The assistant streams server-sent events, and plans are uploaded as images.
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 50m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Remote-User e2e-user;
    proxy_set_header Remote-Email e2e-user@example.com;
    proxy_set_header Remote-Name "E2E User";
    proxy_set_header Remote-Groups romslig-users;

    location /api {
        proxy_pass http://api:8080;
    }

    location / {
        proxy_pass http://web:8080;
    }
}
