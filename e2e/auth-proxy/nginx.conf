# Stands in for Traefik + Authelia forward auth in docker-compose.e2e.yml: one origin, /api to the
# API and everything else to the SPA, with the Remote-* headers set on every request. proxy_set_header
# replaces whatever the client sent, so a browser can't pick its own user (as with Authelia).
# Two users, as two ports: e2e-user on 8080 (host 5173) and e2e-other on 8081 (host 5174).

proxy_buffering off; # the assistant streams server-sent events
proxy_read_timeout 300s;
client_max_body_size 50m; # plans are uploaded as images
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Remote-Email $remote_user_name@example.com;
proxy_set_header Remote-Name $remote_user_name;
proxy_set_header Remote-Groups romslig-users;
proxy_set_header Remote-User $remote_user_name;

server {
    listen 8080;
    set $remote_user_name e2e-user;

    location /api {
        proxy_pass http://api:8080;
    }
    location / {
        proxy_pass http://web:8080;
    }
}

server {
    listen 8081;
    set $remote_user_name e2e-other;

    location /api {
        proxy_pass http://api:8080;
    }
    location / {
        proxy_pass http://web:8080;
    }
}
