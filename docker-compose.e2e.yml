# End-to-end stack: the api and web images as they run in the cluster, PostgreSQL, and an nginx in
# front that plays Authelia's forward auth (sets the Remote-* headers on every request).
#
# pr-e2e.yml sets API_IMAGE / WEB_IMAGE / E2E_IMAGE to the images it just built and runs the suite as
# the `playwright` service. Locally, without them, the images are built from this checkout:
#   docker compose -f docker-compose.e2e.yml up -d --build --wait
#   docker compose -f docker-compose.e2e.yml --profile e2e run --rm --build playwright
# or run the suite from e2e/ with `npx playwright test`. http://localhost:5173 is signed in as
# e2e-user, http://localhost:5174 as e2e-other (both in group romslig-users).
name: romslig-e2e

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: romslig
      POSTGRES_USER: romslig
      POSTGRES_PASSWORD: romslig
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U romslig -d romslig']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    image: ${API_IMAGE:-romslig-api:local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PG_HOST: postgres
      PG_DB: romslig
      PG_USER: romslig
      PG_PASSWORD: romslig
      AUTH_MODE: forward
      ALLOWED_GROUP: romslig-users
      AI_MODE: byok
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:-romslig-web:local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile

  # Readiness gate for `up --wait`: the api and web images are distroless (no shell, no curl), so the
  # proxy, which has wget, checks both through itself.
  auth-proxy:
    image: nginx:1.29-alpine
    ports:
      - '5173:8080'
      - '5174:8081'
    volumes:
      - ./e2e/auth-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/api/health/ready && wget -qO- http://127.0.0.1:8080/ >/dev/null']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 3s

  # The Playwright suite (e2e/Dockerfile on @wshno/playwright-config's runner image). Host network, so
  # the specs reach the stack on http://localhost:5173 exactly as a local `npx playwright test` does.
  playwright:
    image: ${E2E_IMAGE:-romslig-e2e:local}
    build:
      context: e2e
    profiles: [e2e]
    network_mode: host
    environment:
      - CI
      - BASE_URL
    # Reports land in e2e/ on the host, where the workflow's summary and upload look for them.
    volumes:
      - ./e2e/playwright-report:/e2e/playwright-report
      - ./e2e/test-results:/e2e/test-results
    depends_on:
      auth-proxy:
        condition: service_healthy
