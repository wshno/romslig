name: Preview cleanup

# Removes the romslig preview env for a PR when the PR is closed (merged or not): the reusable
# teardown deletes the per-PR overlay from hwinther/proxmox, and Flux prunes the namespace.
#
# No label gate: the teardown is idempotent (a no-op if the overlay was never deployed), so it's
# safe to run for every closed PR.

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  teardown:
    permissions:
      contents: read
    uses: hwinther/reusable-workflows/.github/workflows/gitops-preview-teardown.yml@6b6810e17143f38ac9dc0f84d504e7ff08b1d2bf # v2.26.0
    with:
      target_repo: hwinther/proxmox
      preview_base_path: clusters/production/apps/previews/romslig
      pr_number: ${{ github.event.pull_request.number }}
      client_id: ${{ vars.PROXMOX_GITOPS_CLIENT_ID }}
    secrets:
      app_private_key: ${{ secrets.PROXMOX_GITOPS_APP_PRIVATE_KEY }}

  # Mark the preview comment closed so it's clear in the PR thread.
  update-comment:
    needs: [teardown]
    if: ${{ contains(github.event.pull_request.labels.*.name, 'deploy-feature') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Mark the preview-URL comment as torn down
        uses: hwinther/reusable-workflows/.github/actions/sticky-pr-comment@5ba6e5a72dec8dcd121cc864279889bb2fa6ed73 # v2.31.0
        with:
          github_token: ${{ github.token }}
          comment_identifier: romslig-preview-env
          comment_content: |
            ### Preview environment torn down

            The PR is closed and the preview env has been removed from the cluster (Flux prune).
